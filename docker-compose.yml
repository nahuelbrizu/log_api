# Run the API + MySQL without installing Ruby or MySQL locally:
#   cp .env.example .env    # optional: OAuth keys, SMTP, ...
#   docker compose up --build
# API on http://localhost:3000 (demo user created on first boot).
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: password
      # Docker port forwarding: allow requests whose Host is not localhost.
      RAILS_DEVELOPMENT_HOSTS: localhost,127.0.0.1,app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - mails:/app/tmp/mails

volumes:
  db_data:
  mails:
