openapi: 3.0.3
info:
  title: log_api - Auth & Profiles API
  version: 1.0.0
  description: |
    Authentication backend: email/password, social login (OAuth with PKCE
    one-time codes), JWT access tokens with rotating refresh tokens, and user
    profiles. All request bodies are flat JSON objects; all errors use the
    `Error` envelope.
servers:
  - url: http://localhost:3000
tags:
  - name: Auth
  - name: OAuth
  - name: Me
  - name: Profiles
  - name: Health

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: invalid_credentials }
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: array, items: { type: string } }
              example: { password: ["Password is too short (minimum is 8 characters)"] }
    Message:
      type: object
      properties:
        message: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        provider: { type: string, nullable: true, enum: [google_oauth2, facebook, github, twitter, null] }
        confirmed: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserWithProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            profile:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/Profile" }]
    Profile:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        display_name: { type: string, nullable: true, maxLength: 100 }
        location: { type: string, nullable: true, maxLength: 100 }
        bio: { type: string, nullable: true, maxLength: 2000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProfileInput:
      type: object
      properties:
        display_name: { type: string, maxLength: 100 }
        location: { type: string, maxLength: 100 }
        bio: { type: string, maxLength: 2000 }
    TokenPair:
      type: object
      properties:
        token_type: { type: string, example: Bearer }
        access_token: { type: string, description: "JWT; send it as `Authorization: Bearer <token>`" }
        expires_in: { type: integer, description: Access token lifetime in seconds, example: 900 }
        refresh_token: { type: string, description: "Opaque and single use (rotated on refresh)" }
        refresh_token_expires_in: { type: integer, example: 2592000 }
        user: { $ref: "#/components/schemas/User" }
  responses:
    Error400:
      description: Missing parameter or malformed JSON
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Error401:
      description: Missing, invalid, expired or revoked access token (`unauthorized`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Error404:
      description: Not found (`not_found`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Error422:
      description: Validation failed (`validation_failed`, with `details`)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Error429:
      description: Rate limited (`rate_limited`); see the Retry-After header
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Accepted:
      description: Accepted. Same answer whether or not the email exists.
      content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } }
    Tokens:
      description: Token pair
      content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } }

paths:
  /auth/sign_up:
    post:
      tags: [Auth]
      summary: Register with email and password
      description: Sends a confirmation email. No tokens are issued until the email is confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
                password_confirmation: { type: string }
                name: { type: string, maxLength: 100 }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/Error400" }
        "422": { $ref: "#/components/responses/Error422" }
        "429": { $ref: "#/components/responses/Error429" }

  /auth/confirmation:
    post:
      tags: [Auth]
      summary: Confirm the email with the token from the email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation_token]
              properties:
                confirmation_token: { type: string }
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "422":
          description: "`invalid_token` or `already_confirmed`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    get:
      tags: [Auth]
      summary: Same as POST, for the link in the email
      parameters:
        - { name: confirmation_token, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Confirmed }
        "422": { description: "`invalid_token` or `already_confirmed`" }

  /auth/confirmation/resend:
    post:
      tags: [Auth]
      summary: Resend the confirmation email
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "429": { $ref: "#/components/responses/Error429" }

  /auth/sign_in:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401":
          description: "`invalid_credentials` (same for unknown email and wrong password)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "`unconfirmed`: the email is not confirmed yet"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/Error429" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair (rotation)
      description: |
        The presented refresh token becomes invalid. Reusing an already
        rotated token revokes every token of that login (theft detection).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401":
          description: "`invalid_refresh_token`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /auth/sign_out:
    delete:
      tags: [Auth]
      summary: Revoke the current access token (and refresh tokens)
      security: [{ bearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string, description: Revoke this login's refresh token }
                all: { type: boolean, description: Revoke every refresh token of the user (sign out everywhere) }
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error401" }

  /auth/password:
    post:
      tags: [Auth]
      summary: Request password reset instructions by email
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "429": { $ref: "#/components/responses/Error429" }
    put:
      tags: [Auth]
      summary: Set a new password with the token from the email
      description: Revokes every refresh token of the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_password_token, password]
              properties:
                reset_password_token: { type: string }
                password: { type: string, minLength: 8, maxLength: 72 }
                password_confirmation: { type: string }
      responses:
        "200": { description: Password updated, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "422": { description: "`invalid_token` or `validation_failed`" }

  /auth/providers:
    get:
      tags: [OAuth]
      summary: Social login providers enabled on this server
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, example: github }
                        authorize_url: { type: string, example: "http://localhost:3000/auth/github" }

  /auth/{provider}:
    get:
      tags: [OAuth]
      summary: Start a social login (navigate the browser here)
      description: |
        Open in the browser (SPA: `window.location`; mobile: system browser /
        ASWebAuthenticationSession / Custom Tabs). Redirects to the provider;
        after login the browser lands on `return_to?code=...` (or
        `return_to?error=access_denied|account_conflict`). Exchange the code
        at `POST /auth/oauth/token` within OAUTH_CODE_TTL_SECONDS. Any other
        query param is ignored.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google_oauth2, facebook, github, twitter] } }
        - { name: return_to, in: query, required: true, description: Must exactly match an entry of OAUTH_REDIRECT_ALLOWLIST, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, description: "BASE64URL(SHA256(code_verifier)), no padding", schema: { type: string } }
        - { name: code_challenge_method, in: query, required: false, schema: { type: string, enum: [S256] } }
      responses:
        "302": { description: Redirect to the provider }
        "400":
          description: "`invalid_return_to` or `invalid_code_challenge`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /auth/{provider}/callback:
    get:
      tags: [OAuth]
      summary: Provider callback (register this URL in the provider console)
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      responses:
        "302": { description: "Redirect to return_to?code=... or return_to?error=..." }

  /auth/oauth/token:
    post:
      tags: [OAuth]
      summary: Exchange the one-time code for a token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, code_verifier, return_to]
              properties:
                code: { type: string }
                code_verifier: { type: string, description: The PKCE verifier (43-128 chars) }
                return_to: { type: string, description: Same value used to start the login }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400":
          description: "`invalid_grant`: unknown, expired, used, wrong verifier or return_to"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /me:
    get:
      tags: [Me]
      summary: Current user (with profile)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { type: object, properties: { user: { $ref: "#/components/schemas/UserWithProfile" } } }
        "401": { $ref: "#/components/responses/Error401" }
    patch:
      tags: [Me]
      summary: Update name and/or password
      description: Changing the password requires current_password and revokes all refresh tokens.
      security: [{ bearer: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                current_password: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        "200": { description: Updated user }
        "401": { $ref: "#/components/responses/Error401" }
        "422": { $ref: "#/components/responses/Error422" }
    delete:
      tags: [Me]
      summary: Delete the account (and its profile and tokens)
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error401" }

  /profiles:
    get:
      tags: [Profiles]
      summary: List profiles (paginated)
      security: [{ bearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles: { type: array, items: { $ref: "#/components/schemas/Profile" } }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        "401": { $ref: "#/components/responses/Error401" }
    post:
      tags: [Profiles]
      summary: Create the current user's profile (one per user)
      security: [{ bearer: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfileInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { profile: { $ref: "#/components/schemas/Profile" } } } } } }
        "401": { $ref: "#/components/responses/Error401" }
        "409": { description: "`profile_exists`" }
        "422": { $ref: "#/components/responses/Error422" }

  /profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Profiles]
      summary: Show a profile
      security: [{ bearer: [] }]
      responses:
        "200": { description: Profile, content: { application/json: { schema: { type: object, properties: { profile: { $ref: "#/components/schemas/Profile" } } } } } }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }
    patch:
      tags: [Profiles]
      summary: Update your own profile (404 for others' profiles)
      security: [{ bearer: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfileInput" } } }
      responses:
        "200": { description: Updated }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }
        "422": { $ref: "#/components/responses/Error422" }
    delete:
      tags: [Profiles]
      summary: Delete your own profile (404 for others' profiles)
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }

  /up:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200": { description: OK, content: { application/json: { example: { status: ok } } } }
